[project]
name = "lfm"
version = "0.1.0"
description = "Herramienta personal para LaLiga Fantasy"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "selectolax>=0.3",
    "python-dotenv>=1.0",
    "tenacity>=8.5",
]

# Grupo `dev`: uv lo instala por defecto en `uv sync` y `uv run`, así un `uv run` suelto
# no desinstala pytest/ruff (pasaba con un extra opcional). El job diario usa `--no-dev`.
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lfm"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
